# 프로덕션 배포 전 빌드 품질 게이트 (condition-based)
# build → gate 조건 평가 → pass 시 staging-deploy → prod-deploy
# condition: build exitCode eq 0 (minimal ctx 에서 undefined → fail_node)
adplVersion: 1
name: deploy-with-gate

triggers:
  - id: manual
    type: manual

pipeline:
  - id: build
    type: shell
    command: "pnpm build"

  - id: staging-deploy
    type: shell
    command: "./deploy.sh staging"

  - id: approval
    type: gate
    condition:
      field: "$nodes.build.data.exitCode"
      truthy: false
    onFail: fail_node
    message: "빌드 실패 — 배포 차단"

  - id: route-approval
    type: branch
    cases:
      - when:
          field: "$nodes.approval.data.passed"
          truthy: true
        then:
          - id: prod-deploy
            type: shell
            command: "./deploy.sh production"
      - default: true
        then:
          - id: notify-reject
            type: webhook_out
            provider: slack
            url: "${$env.SLACK_WEBHOOK_URL}"
            body:
              text: "배포 취소됨: gate 조건 미충족"

settings:
  allowedEnvKeys:
    - SLACK_WEBHOOK_URL
